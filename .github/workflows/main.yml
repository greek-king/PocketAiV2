
name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate Xcode project
        id: project
        run: |
          PROJECT=$(find . -name "PocketAI.xcodeproj" -type d -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: PocketAI.xcodeproj was not found."
            echo "Repository contents:"
            find . -maxdepth 4 -print
            exit 1
          fi

          echo "Found project: $PROJECT"
          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project "${{ steps.project.outputs.path }}" \
            -scheme PocketAI \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
